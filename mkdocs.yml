# Configuration
theme:
  name: material
  language: "en"
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/Rx_Logo.png
  favicon: assets/favicon.png
  palette:
    # Palette toggle for automatic (system preference) mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search
  - tags
  - privacy # self-host external assets (Google Fonts): faster first paint, no third-party request
  - social:
      enabled: !ENV [CI, false] # needs the imaging dependencies; generate cards in CI only
  - redirects:
      redirect_maps:
        observable.md: learn/observable.md
        observer.md: learn/observer.md
        cold-observables.md: learn/cold-observables.md
        hot-observables.md: learn/hot-observables.md
        promise-vs-observable.md: learn/promise-vs-observable.md
        async-pipe.md: angular/async-pipe.md
        Operators/RxJS-operators.md: operators/index.md
        Operators/Creation/empty-never.md: operators/creation/empty-never.md
        Operators/Creation/from.md: operators/creation/from.md
        Operators/Creation/interval.md: operators/creation/interval.md
        Operators/Creation/of.md: operators/creation/of.md
        Operators/Creation/timer.md: operators/creation/timer.md
        Operators/Transformation/concatMap.md: operators/transformation/concatMap.md
        Operators/Transformation/exhaustMap.md: operators/transformation/exhaustMap.md
        Operators/Transformation/map.md: operators/transformation/map.md
        Operators/Transformation/mergeMap.md: operators/transformation/mergeMap.md
        Operators/Transformation/switchMap.md: operators/transformation/switchMap.md
        Operators/Transformation/switchMap-mergeMap-concatMap.md: comparisons/switchMap-mergeMap-concatMap.md
        Operators/Filtering/debounceTime.md: operators/filtering/debounceTime.md
        Operators/Filtering/distinctUntilChanged.md: operators/filtering/distinctUntilChanged.md
        Operators/Filtering/filter.md: operators/filtering/filter.md
        Operators/Filtering/find.md: operators/filtering/find.md
        Operators/Filtering/first.md: operators/filtering/first.md
        Operators/Filtering/last.md: operators/filtering/last.md
        Operators/Filtering/skip.md: operators/filtering/skip.md
        Operators/Filtering/take.md: operators/filtering/take.md
        Operators/Filtering/takeUntil.md: operators/filtering/takeUntil.md
        Operators/Combination/combineLatest.md: operators/combination/combineLatest.md
        Operators/Combination/forkJoin.md: operators/combination/forkJoin.md
        Operators/Combination/withLatestFrom.md: operators/combination/withLatestFrom.md
        Operators/Combination/zip.md: operators/combination/zip.md
        Operators/Error/catchError.md: operators/error-handling/catchError.md
